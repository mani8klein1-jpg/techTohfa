services:
  db:
    image: postgres:16
    container_name: techstore-db
    environment:
      - POSTGRES_USER=techstore
      - POSTGRES_PASSWORD=techstore123
      - POSTGRES_DB=techstore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techstore"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techstore-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://techstore:techstore123@db:5432/techstore
      - SECRET_KEY=techstore-geheimer-schluessel-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: techstore-frontend
    ports:
      - "5500:5500"
    volumes:
      - ./frontend/bilder:/app/bilder
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data: