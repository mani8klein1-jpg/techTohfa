<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden - TechStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="bilder/logo.png" alt="TechStore Logo">
            </a>
            <nav>
                <div class="suchleiste">
                    <input type="text" id="suchInput" placeholder="🔍 Durchsuche TechTOHFA" autocomplete="off">
                    <button onclick="sucheAusfuehrenGlobal()">Suchen</button>
                </div>
                <ul>
                    <li><a href="index.html">Produkte</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- FORMULAR -->
    <div class="form-box">
        <h1 id="formTitle">Anmelden</h1>
        <p class="subtitle" id="formSubtitle">Melden Sie sich an, um einzukaufen.</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" required placeholder="ihre@email.de" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="passwort">Passwort</label>
                <input type="password" id="passwort" required placeholder="••••••••" autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                Anmelden
            </button>
        </form>
        
        <p class="error" id="errorMsg" style="display:none;"></p>
        
        <p style="text-align:center; margin-top:20px; color:#888; font-size:14px;">
            <span id="switchText">Noch kein Konto?</span>
            <a href="#" id="switchLink" style="color:#e94560; font-weight:700; text-decoration:none;">
                Jetzt registrieren
            </a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
